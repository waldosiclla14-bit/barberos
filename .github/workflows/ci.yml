name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  quality:
    name: Quality (typecheck · lint · build)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  tests:
    name: Tests (fase 2 + flujo)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma db push --skip-generate
      - run: npx tsx scripts/seed.ts
      - run: npx tsx scripts/test-fase2.ts
      - run: npx tsx scripts/test-flujo.ts